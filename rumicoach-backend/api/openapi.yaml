              schema:
                type: string

  /admin/test-setup:
    post:
      summary: Set up database for testing using a persona
      tags:
        - Admin
      operationId: SetupTestData
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json: 
            schema:
              $ref: '#/components/schemas/SetupTestDataRequest'
      responses:
        '200':
          description: Test data setup completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid request or unsupported persona
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)

  /admin/reset-account:
    post:
      summary: Reset the calling admin's own account to a freshly created one (test only)
      description: >
        Returns the caller's account to the state it had the moment it was provisioned:
        every user-scoped row is deleted — session history, exercises, memories,
        commitments and their plans, badges, notifications, recommendations, the chat
        conversation, feedback (images included), the minutes ledger and the channel
        usage records — and the profile row goes back to its column defaults, with the
        state set to ONBOARDING_INTRO (where a new customer starts) and the details that
        intro collects (country, date of birth, gender) cleared so it collects them again.
        The balance drops to zero and the WhatsApp/Telegram binding and push tokens are
        removed, so the account is reachable only by signing in again.


        What survives is what identifies the account rather than what it did: the id, the
        sign-in identity (email, phone, name), the data region, the language, and the
        consent timestamps.


        This is deliberately stronger than anything a user can trigger. `DELETE /me/data`
        redacts sessions and keeps both the ledger and the messaging connection on
        purpose; this endpoint exists for QA, is admin-only, and acts solely on the
        caller's own account.
      tags:
        - Admin
      operationId: ResetAccount
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account reset
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: User not found

  /admin/users/{id}/credits:
    post:
      summary: Credit session minutes to a user (manual, until a payment provider exists)
      tags:
        - Admin
      operationId: PostAdminUsersIdCredits
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreditRequest'
      responses:
        '201':
          description: Credit applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceTransaction'
        '400':
          description: Invalid amount or type
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: User not found

  /recommendations:
    get:
      summary: Get user recommendations
      tags:
        - Users
      operationId: GetRecommendations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [book, article, video, podcast, other]
      responses:
        '200':
          description: Paginated list of user recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPaginatedResponse'
        '401':
          description: Unauthorized

  /chat/sessions/{sessionID}/feedback:
    post:
      summary: Submit user feedback for a completed coaching session
      tags:
        - Chat
      operationId: SubmitSessionFeedback
      security:
        - BearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackRequest'
      responses:
        '200':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                required:
                  - status
                  - message
        '400':
          description: Bad request / validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (session belongs to another user)
        '404':
          description: Session not found

  /webhooks/whatsapp:
    get:
      summary: Meta WhatsApp verification webhook
      tags:
        - Webhooks
      operationId: GetWebhooksWhatsapp
      responses:
        '200':
          description: OK
    post:
      summary: Meta WhatsApp incoming messages webhook
      tags:
        - Webhooks
      operationId: PostWebhooksWhatsapp
      responses:
        '200':
          description: OK

  /webhooks/telegram/{secret}:
    post:
      summary: Telegram incoming updates webhook
      tags:
        - Webhooks
      operationId: PostWebhooksTelegramSecret
      parameters:
        - name: secret
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /webhooks/twilio/sms:
    post:
      summary: Twilio incoming SMS webhook
      tags:
        - Webhooks
      operationId: PostWebhooksTwilioSms
      responses:
        '200':
          description: OK

  /webhooks/revenuecat:
    post:
      summary: RevenueCat purchase events webhook (credits the minutes balance)
      tags:
        - Webhooks
      operationId: PostWebhooksRevenuecat
      responses:
        '200':
          description: Event processed (or deliberately ignored/duplicate)
        '401':
          description: Missing or wrong Authorization header
        '500':
          description: Transient failure — RevenueCat should retry
        '503':
          description: REVENUECAT_WEBHOOK_AUTH not configured on this deployment

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LeadRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        company:
          type: string
        country:
          type: string
        size:
          type: string
        message:
          type: string
        origin:
          type: string
        language:
          type: string
      required:
        - name
        - email
        - company
        - country
        - size

    LeadAdmin:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        company:
          type: string
        country:
          type: string
        size:
          type: string
        message:
          type: string
        origin:
          type: string
        language:
          type: string
        state:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeadListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeadAdmin'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    UpdateLeadRequest:
      type: object
      properties:
        state:
          type: string
      required:
        - state

    FCMTokenRequest:
      type: object
      properties:
        token:
          type: string
        platform:
          type: string
      required:
        - token

    Integration:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
          description: Channel provider ("whatsapp")
        status:
          type: string
          description: Binding status ("pending", "active", "revoked")
        maskedExternalId:
          type: string
          description: Masked phone/chat id (e.g. "+3519•••••78"), only set when linked
        replyMode:
          type: string
          enum: [text, audio, auto]
          description: How Rumi answers ("text", "audio", or "auto")
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - provider
        - status
        - replyMode
        - createdAt

    ChannelLinkResponse:
      type: object
      properties:
        code:
          type: string
          description: One-time link code (e.g. "RUMI-7K3M2X")
        waLink:
          type: string
          description: wa.me deep link that pre-fills the code
        expiresAt:
          type: string
          format: date-time
      required:
        - code
        - waLink
        - expiresAt

    ChannelUpdateRequest:
      type: object
      properties:
        replyMode:
          type: string
          enum: [text, audio, auto]
          description: How Rumi answers ("text", "audio", or "auto")

    VerificationRequest:
      type: object
      properties:
        email:
          type: string
        phoneNumber:
          type: string
        type:
          type: string
          enum: [email, phone]
        event:
          type: string
      required:
        - type

    VerificationCheck:
      type: object
      properties:
        email:
          type: string
        phoneNumber:
          type: string
        type:
          type: string
          enum: [email, phone]
        code:
          type: string
      required:
        - type
        - code

    VerificationResponse:
      type: object
      properties:
        message:
          type: string
        verified:
          type: boolean
        verificationId:
          type: string

    LoginWithCodeRequest:
      type: object
      properties:
        type:
          type: string
          enum: [email, phone]
        identifier:
          type: string
        code:
          type: string
      required:
        - type
        - identifier
        - code

    UpdateIdentifierRequest:
      type: object
      properties:
        type:
          type: string
          enum: [email, phone]
        identifier:
          type: string
        verificationId:
          type: string
      required:
        - type
        - identifier
        - verificationId

    GoogleLoginRequest:
      type: object
      properties:
        accessToken:
          type: string
        idToken:
          type: string

    AppleLoginRequest:
      type: object
      properties:
        identityToken:
          type: string
          description: JWT identity token from ASAuthorizationAppleIDCredential.
        email:
          type: string
          description: >-
            Email as reported by the client on first authorization. Informational
            only — the server trusts the verified email inside the identity token.
        name:
          type: string
          description: >-
            Full name from the first authorization (Apple never provides it again).
            Informational only; login never creates accounts.
      required:
        - identityToken

    LinkAppleRequest:
      type: object
      properties:
        identityToken:
          type: string
          description: JWT identity token from ASAuthorizationAppleIDCredential.
      required:
        - identityToken

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        refreshToken:
          type: string
        dataRegion:
          type: string
          enum: [eu, us]
          description: The region where this user's data is stored.
        apiBaseUrl:
          type: string
          description: Base URL of the regional API the client must use for all non-auth calls.

    SSOVerificationRequest:
      type: object
      properties:
        idToken:
          type: string
        accessToken:
          type: string
        type:
          type: string
          enum: [google, apple]
      required:
        - type

    WaitlistRequest:
      type: object
      properties:
        email:
          type: string
        phoneNumber:
          type: string
        name:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        country:
          type: string
        region:
          type: string
        dataRegion:
          type: string
          enum: [eu, us]
          default: eu
          description: Where the user's data will be stored. Chosen by the user at signup.
        preferredLanguage:
          type: string
        emailVerificationId:
          type: string
        phoneVerificationId:
          type: string
        googleIdToken:
          type: string
        googleAccessToken:
          type: string
        appleIdentityToken:
          type: string
          description: Sign in with Apple identity token (iOS). Replaces OTP verification.
        termsAndConditionsAccepted:
          type: boolean
        marketingAccepted:
          type: boolean
        aiAccepted:
          type: boolean
      required:
        - name

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        coachGender:
          type: string
        country:
          type: string
        region:
          type: string
        dataRegion:
          type: string
          enum: [eu, us]
        preferredLanguage:
          type: string
        isActive:
          type: boolean
        waitlisted:
          type: boolean
          description: "True for a waitlist signup whose regional profile has not been provisioned yet; activating the user provisions it."
        createdAt:
          type: string
          format: date-time
          description: "Signup time (for waitlisted users, when they joined the waitlist)."
        theme:
          type: string
        focusArea:
          type: string
          nullable: true
          description: "The Wheel of Life area the user committed to work on (chosen during onboarding), in the user's language."
        coachVoice:
          type: string
          enum: [algieba, charon, despina, enceladus, gacrux, orus, vindemiatrix]
        termsAndConditionsAcceptedAt:
          type: string
          format: date-time
        marketingAcceptedAt:
          type: string
          format: date-time
        lastOnlineAt:
          type: string
          format: date-time
          nullable: true
        lastPlatform:
          type: string
          nullable: true
        aiAcceptedAt:
          type: string
          format: date-time
        balanceSeconds:
          type: integer
          format: int64
          description: >-
            Remaining voice-session balance in seconds (may be negative). Starting a
            billable session requires at least 60 seconds — anything below that is
            refused on the session WebSocket, which sends an INSUFFICIENT_BALANCE error
            frame and then closes with code 4402.
        inFirstJourney:
          type: boolean
          description: >-
            True while the user still has free introductory sessions left — the onboarding
            intro and the Vision session it hands over to — and is therefore exempt from the
            balance gate. Derived from what those sessions produce: the profile details the
            intro collects (country, date of birth, gender) and the ideal-life vision the
            Vision session writes. It stays true while either is still missing, so a session
            the user abandoned after a few seconds costs them nothing.

            Informational only. Clients must NOT gate on it: the WebSocket is the
            enforcement and it now refuses in a form a client can read, so an app that
            pre-empts the call is keeping a second copy of a billing rule that will drift
            from this one. The name predates the change of rule and is kept because shipped
            app builds read it.
        chatHistoryRetentionDays:
          type: integer
          description: How long the WhatsApp/Telegram conversation is kept, in days; 0 keeps it indefinitely.

    BalanceTransaction:
      type: object
      properties:
        id:
          type: string
          description: For a grouped message row, the id of the newest debit in the run.
        type:
          type: string
          enum: [subscription, top_up, session_usage, session_free, message_usage, refund]
        amountSeconds:
          type: integer
          format: int64
          description: >-
            Signed: positive = credit, negative = debit. Always 0 for session_free —
            the row exists so the history accounts for the session, not to move money.
            For a grouped message row, the run's debits summed.
        balanceAfter:
          type: integer
          format: int64
          description: The balance after this row applied (after the newest debit, for a grouped message row).
        sessionId:
          type: string
          description: Communication session charged by a session_usage debit (or recorded by a session_free row)
        sessionType:
          type: string
          description: Type of the session (if applicable)
        product:
          type: string
          description: Plan/package label for purchase credits and refunds
        description:
          type: string
        createdAt:
          type: string
          format: date-time
          description: When this row applied (the newest debit's time, for a grouped message row).
        day:
          type: string
          description: "Grouped message rows only: the calendar day of the run, YYYY-MM-DD in the request's X-Timezone."
        messageCount:
          type: integer
          description: "Grouped message rows only: how many charged replies the run collapses."
        plan:
          type: string
          enum: [monthly, annual]
          description: >-
            Billing cadence of a subscription credit, derived server-side from the
            product id so clients translate an enum instead of parsing store slugs.
            Subscription rows only, and absent when the product names neither cadence.

    BalanceTransactionPaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BalanceTransaction'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    UsageEntry:
      type: object
      required:
        - kind
        - occurredAt
        - seconds
      properties:
        kind:
          type: string
          enum: [session, messages]
        occurredAt:
          type: string
          format: date-time
          description: "Session end for sessions; the day's latest message for message groups. Sort key of the feed."
        seconds:
          type: integer
          format: int64
          description: >-
            How long this entry ran, in seconds (always positive). For a free session
            this is the real duration even though nothing was charged — see `free`, and
            note it is therefore NOT always what came off the balance.
        free:
          type: boolean
          description: >-
