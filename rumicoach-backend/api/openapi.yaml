          in: query
          required: false
          description: Scope session-based metrics to sessions started at or after this time (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Scope session-based metrics to sessions started at or before this time (RFC3339).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Aggregate dashboard metrics
          content:
