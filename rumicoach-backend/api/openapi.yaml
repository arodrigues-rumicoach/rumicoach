openapi: 3.0.3
info:
  title: rumi.coach API
  version: 1.0.0
servers:
  - url: /v1

paths:
  /leads:
    post:
      summary: Submit a new lead
      tags:
        - Leads
      operationId: PostLeads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadRequest'
      responses:
        '201':
          description: Lead created successfully
        '400':
          description: Bad request

  /auth/verifications/request:
    post:
      summary: Request verification code (email or SMS)
      tags:
        - Auth
      operationId: RequestVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Bad request

  /auth/verifications/verify:
    post:
      summary: Verify the requested code
      description: >-
        Verifies the code sent to the identifier. In the signup flow, an existing
        account is only revealed here — after the caller proved ownership of the
        mailbox/number by entering a valid code — as a 400 with error code
        EMAIL_ALREADY_EXISTS or PHONE_ALREADY_EXISTS. An invalid code always
        returns the generic INVALID_CODE, so account existence cannot be probed.
      tags:
        - Auth
      operationId: VerifyCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCheck'
      responses:
        '200':
          description: Verificaton successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Invalid or expired code (INVALID_CODE), or — only after a valid code — the account already exists (EMAIL_ALREADY_EXISTS / PHONE_ALREADY_EXISTS)

  /auth/verifications/sso:
    post:
      summary: Verify SSO Token (e.g. Google) and check user existence
      tags:
        - Auth
      operationId: VerifySSO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOVerificationRequest'
      responses:
        '200':
          description: Verification successful (token is valid and account does not exist)
        '400':
          description: Invalid token, parameters, or account already exists

  /auth/login/code:
    post:
      summary: Login via verification code
      tags:
        - Auth
      operationId: LoginWithCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginWithCodeRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid code
        '403':
          description: Account inactive or not found

  /auth/google:
    post:
      summary: Login via Google IdToken
      tags:
        - Auth
      operationId: GoogleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid Token

  /auth/apple:
    post:
      summary: Login via Apple identity token (Sign in with Apple, iOS only)
      tags:
        - Auth
      operationId: AppleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid Token
        '403':
          description: Account inactive or not found

  /auth/refresh:
    post:
      summary: Refresh JWT Access Token
      tags:
        - Auth
      operationId: RefreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /waitlist:
    post:
      summary: Join the waitlist
      tags:
        - Waitlist
      operationId: JoinWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistRequest'
      responses:
        '200':
          description: Joined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid validations

  /auth/register:
    post:
      summary: Register a new active user account
      tags:
        - Auth
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistRequest'
      responses:
        '200':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid validations

  /auth/me/link/apple:
    post:
      summary: Link a Sign in with Apple credential to the current account
      description: >-
        Attaches the Apple ID inside the identity token to the authenticated
        account, so Apple sign-in works from then on whichever provider created it.
        Required for "Hide My Email" users: their token carries a per-app private
        relay address that can never match an account created another way, so
        POST /auth/apple has nothing to match on.
      tags:
        - Auth
      operationId: LinkAppleAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAppleRequest'
      responses:
        '200':
          description: Linked (or already linked to this same Apple ID)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Apple ID already linked to another account, or this account already has a different one
        '401':
          description: Unauthorized or invalid identity token

  /auth/me/identifier:
    put:
      summary: Update email or phone number for current user
      tags:
        - Auth
      operationId: UpdateIdentifier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdentifierRequest'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid validations
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /me:
    get:
      summary: Get current authenticated user
      tags:
        - Users
      operationId: GetCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    patch:
      summary: Update current user
      tags:
        - Users
      operationId: UpdateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    delete:
      summary: Delete current user (anonymize account)
      tags:
        - Users
      operationId: DeleteCurrentUser
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account anonymized successfully
        '401':
          description: Unauthorized

  /me/profile:
    get:
      summary: Get user profile and progress statistics
      tags:
        - Users
      operationId: GetMeProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized

  /me/data:
    get:
      summary: Export all personal data for GDPR compliance
      tags:
        - Users
      operationId: ExportCurrentUserData
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A JSON export containing all user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataExport'
        '401':
          description: Unauthorized
    delete:
      summary: Delete user data, all of it or by category
      description: >
        Erases the user's data. Without `scope` the whole account's coaching data goes,
        which is what callers written before this parameter expected. `scope` narrows it
        to one or more categories so the user can, say, clear their chat without losing
        their journey. Two things are never deleted by any scope: the minutes ledger
        (`balance_transactions` and the balance itself — erasing data is not a refund),
        and messaging integrations, since revoking one silently disconnects the user's
        WhatsApp or Telegram. Only account deletion removes those.
      tags:
        - Users
      operationId: DeleteCurrentUserData
      security:
        - BearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: >
            Comma-separated categories to erase. Omit for `all`. `memories` drops saved
            memories; `chat` drops the WhatsApp/Telegram conversation but keeps the
            connection; `commitments` drops commitments and their habit plans;
            `progress` drops session history, and with it the streak and the growth
            journey; `all` covers everything. Combining `all` with others is the same
            as `all`. An unrecognized value is rejected.
          schema:
            type: string
            example: memories,chat
      responses:
        '204':
          description: Data deleted successfully
        '400':
          description: Unknown scope value (INVALID_PAYLOAD)
        '401':
          description: Unauthorized

  /me/data/export:
    post:
      summary: Email the user a copy of their data
      description: >
        Builds the same export as `GET /me/data` and emails it to the address on the
        account as a JSON attachment, rather than returning it as a download. Answers 202
        as soon as the request is accepted; the file arrives afterwards. A download is of
        little use on mobile, where the browser has nowhere meaningful to put it.
      tags:
        - Users
      operationId: RequestUserDataExport
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Export accepted; it will be emailed to the account's address
        '401':
          description: Unauthorized
        '404':
          description: User not found
        '422':
          description: The account has no email address to send the export to

  /feedback:
    post:
      summary: Send feedback, a bug report, or a feature request
      description: >
        Stores the report and any attached screenshots, and notifies the team. Images are
        base64-encoded in the body, capped at 3 per report and 5MB each after decoding, and
        their format is sniffed from the bytes rather than taken from the client. An upload
        that fails costs the screenshot, never the report itself.
      tags:
        - Users
      operationId: SubmitFeedback
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          description: Invalid category, empty description, or an unacceptable image
        '401':
          description: Unauthorized

  /me/fcm-token:
    post:
      summary: Register a new device FCM token for push notifications
      tags:
        - Users
      operationId: RegisterFCMToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FCMTokenRequest'
      responses:
        '204':
          description: FCM token registered successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /me/transactions:
    get:
      summary: Get the user's balance transaction history (newest first)
      description: >
        The minutes bank's ledger, bank-statement style: signed credits and debits with
        the balance after each row. With grouped=true, consecutive message_usage debits
        falling on the same calendar day (X-Timezone header decides the day boundary,
        default UTC) collapse into one row carrying their summed amount, the newest
        row's id/balanceAfter/createdAt, plus day and messageCount. A run is broken by
        any interleaved non-message row, so the running balance stays arithmetically
        consistent between adjacent rows.
      tags:
        - Users
      operationId: GetTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: grouped
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Collapse same-day runs of message_usage debits into one row per run.
      responses:
        '200':
          description: Paginated list of balance transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceTransactionPaginatedResponse'
        '401':
          description: Unauthorized

  /me/usage:
    get:
      summary: Get the user's usage history (billable sessions and companion messages, newest first)
      deprecated: true
      description: >
        DEPRECATED: the app's Subscription & usage screen now renders the statement view
        (GET /me/transactions?grouped=true) instead. Kept only for app versions already
        in the field; delete the endpoint and internal/services/usage once the
        statement-based release is the minimum supported app version.

        Merged usage feed for the Subscription & usage screen. Session entries come from
        the balance ledger's session rows — session_usage debits plus the zero-amount
        session_free rows that mark the free opening pair, flagged `free: true` and shown
        at their real duration. Message entries are companion-channel messages sent by
        Rumi, grouped per calendar day (X-Timezone header decides the day boundary,
        default UTC), each charged from the ledger's message_usage debits. This is usage,
        not session history — no transcripts or summaries.
      tags:
        - Users
      operationId: GetUsage
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated usage history plus lifetime totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageHistoryResponse'
        '401':
          description: Unauthorized

  /me/integrations:
    get:
      summary: List the user's integrations (WhatsApp, ...)
      tags:
        - Integrations
      operationId: GetIntegrations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of channel bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Integration'
        '401':
          description: Unauthorized

  /me/integrations/whatsapp/link:
    post:
      summary: Start linking the user's WhatsApp number (returns a one-time code and wa.me link)
      tags:
        - Integrations
      operationId: LinkWhatsAppIntegration
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Link code created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelLinkResponse'
        '401':
          description: Unauthorized
        '503':
          description: WhatsApp channel not available

  /me/integrations/telegram/link:
    post:
      summary: Start linking the user's Telegram account (returns a one-time code and t.me link)
      tags:
        - Integrations
      operationId: LinkTelegramIntegration
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Link code created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelLinkResponse'
        '401':
          description: Unauthorized
        '503':
          description: Telegram channel not available

  /me/integrations/{integrationId}:
    get:
      summary: Get details of an integration by ID or provider name (e.g., whatsapp)
      tags:
        - Integrations
      operationId: GetIntegration
      security:
        - BearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Integration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '401':
          description: Unauthorized
        '404':
          description: Channel binding not found
    patch:
      summary: Update an integration (e.g. reply mode)
      tags:
        - Integrations
      operationId: UpdateIntegration
      security:
        - BearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdateRequest'
      responses:
        '200':
          description: Updated channel binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Channel binding not found
    delete:
      summary: Unlink an integration
      tags:
        - Integrations
      operationId: DeleteIntegration
      security:
        - BearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Channel binding revoked
        '401':
          description: Unauthorized
        '404':
          description: Channel binding not found

  /eisenhower-matrix:
    get:
      summary: Get user Eisenhower Matrix exercises history
      tags:
        - Users
      operationId: GetEisenhowerMatrix
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of user Eisenhower Matrix exercises
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EisenhowerMatrixPaginatedResponse'
        '401':
          description: Unauthorized

  /eisenhower-matrix/{id}:
    get:
      summary: Get a specific Eisenhower Matrix exercise by ID
      tags:
        - Users
      operationId: GetEisenhowerMatrixId
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Eisenhower Matrix exercise data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EisenhowerMatrixExercise'
        '401':
          description: Unauthorized
        '404':
          description: Exercise not found

  /wheel-of-life:
    get:
      summary: Get user Wheel of Life exercises history
      tags:
        - Users
      operationId: GetWheelOfLife
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of user Wheel of Life exercises
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WheelOfLifePaginatedResponse'
        '401':
          description: Unauthorized

  /wheel-of-life/{id}:
    get:
      summary: Get a specific Wheel of Life exercise by ID
      tags:
        - Users
      operationId: GetWheelOfLifeId
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wheel of Life exercise data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WheelOfLifeExercise'
        '401':
          description: Unauthorized
        '404':
          description: Exercise not found

  /memories:
    get:
      summary: Get user memories
      tags:
        - Users
      operationId: GetMemories
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MemoryCategory'
        - name: text
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of user memories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryPaginatedResponse'
        '401':
          description: Unauthorized

  /memories/{memoryId}:
    delete:
      summary: Delete a specific memory
      tags:
        - Users
      operationId: DeleteMemory
      security:
        - BearerAuth: []
      parameters:
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Memory not found

  /commitments:
    get:
      summary: List the user's present and future commitments
      description: >-
        Returns one entry per commitment with its next occurrence (nextDate):
        recurring commitments resolve to the next matching weekday (today counts),
        one-time commitments to their date. Ordered by nextDate ascending, so
        overdue one-time commitments (past date, not done) come first, then today,
        then upcoming. One-time commitments already completed on a past date are
        excluded. done/status reflect today's completion state for commitments due
        today.
      tags:
        - Users
      operationId: GetCommitments
      security:
        - BearerAuth: []
      parameters:
        - name: history
          in: query
          description: If true, returns all commitments (past and future), sorted by created date descending.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: The user's commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commitment'
        '401':
          description: Unauthorized
    post:
      summary: Create a manual commitment
      tags:
        - Users
      operationId: CreateCommitment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommitmentRequest'
      responses:
        '201':
          description: Commitment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /commitments/{commitmentId}:
    patch:
      summary: Update a commitment (edit fields and/or toggle completion)
      tags:
        - Users
      operationId: UpdateCommitment
      security:
        - BearerAuth: []
      parameters:
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommitmentRequest'
      responses:
        '200':
          description: Commitment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Commitment not found
    delete:
      summary: Delete a commitment
      tags:
        - Users
      operationId: DeleteCommitment
      security:
        - BearerAuth: []
      parameters:
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Commitment deleted
        '401':
          description: Unauthorized
        '404':
          description: Commitment not found


  /usage-calendar:
    get:
      summary: Get usage calendar statistics for a given month
      tags:
        - Users
      operationId: GetUsageCalendar
      security:
        - BearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            description: "YYYY-MM format"
      responses:
        '200':
          description: Usage calendar stats and daily sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageCalendarResponse'
        '400':
          description: Bad request (invalid month format)
        '401':
          description: Unauthorized

  /streak:
    get:
      summary: Get user streak information
      tags:
        - Users
      operationId: GetStreak
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Streak information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakResponse'
        '401':
          description: Unauthorized

  /journey:
    get:
