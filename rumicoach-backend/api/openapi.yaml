          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '404':
          description: User not found

    patch:
      summary: Update user details or status (e.g. isActive) for admin
      tags:
        - Admin
      operationId: PatchAdminUsersId
      security:
        - BearerAuth: []
