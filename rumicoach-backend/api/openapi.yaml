    Commitment:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [one_time, recurring]
        origin:
          type: string
          enum: [plan, manual, behavior]
          description: "Where the commitment came from: 'plan' (created by a coaching session as part of the commitment plan), 'manual' (added by the user), or 'behavior' (projected from a behavior plan)."
        days:
          type: array
          items:
            type: integer
          description: "Days of the week for recurring commitments (1 = Monday, 2 = Tuesday, ..., 7 = Sunday)"
        date:
          type: string
          description: "Specific date for one-time commitments (YYYY-MM-DD)"
        nextDate:
          type: string
          description: "Next occurrence of this commitment (YYYY-MM-DD, user's timezone): the next matching weekday for recurring, the date for one-time (past when overdue). Present on the /commitments list, absent in history mode."
        occurrenceDate:
          type: string
          description: "The day this entry refers to (YYYY-MM-DD, user's timezone). Only present with history=true, where each entry is ONE past occurrence rather than the commitment as a whole — a recurring commitment yields one entry per scheduled day. Together with id it uniquely keys a history row."
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: "When a recurring commitment was ended by the user. It stops generating occurrences from then on, but past ones remain in history. Null while it is still running."
        status:
          type: string
          enum: [pending, completed, overdue, missed]
          description: "In the normal list: pending, completed or overdue for the commitment as a whole. In history mode it describes that single past occurrence — 'completed' if it was done that day, 'missed' if it was not."
      required:
        - id
        - title
        - type
        - origin
        - status

    ToggleCommitmentRequest:
      type: object
      properties:
        done:
          type: boolean
      required:
        - done

    CreateCommitmentRequest:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum: [one_time, recurring]
        days:
          type: array
          items:
            type: integer
          description: "Days of the week for recurring commitments (1 = Monday, ..., 7 = Sunday)"
        date:
          type: string
          description: "Specific date for one-time commitments (YYYY-MM-DD)"
        endDate:
          type: string
          nullable: true
          description: "The day a recurring commitment stops (YYYY-MM-DD, user's timezone). Coaching sessions set this when the habit is agreed, so it has a horizon to complete rather than running forever. Ignored for one-time commitments — their own date is their end."
      required:
        - title
        - type

    UpdateCommitmentRequest:
      type: object
      description: "Partial update. Any provided field is applied; omitted fields are unchanged."
      properties:
        title:
          type: string
        type:
          type: string
          enum: [one_time, recurring]
        days:
          type: array
          items:
            type: integer
        date:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
          description: "Set the day a recurring commitment stops (YYYY-MM-DD). Send null to remove the horizon and let it run on."
        done:
          type: boolean

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        theme:
          type: string
        coachGender:
          type: string
        country:
          type: string
        region:
          type: string
        preferredLanguage:
          type: string
        coachVoice:
          type: string
          enum: [algieba, charon, despina, enceladus, gacrux, orus, vindemiatrix]
        chatHistoryRetentionDays:
          type: integer
          enum: [0, 3, 7, 30]
          description: >
            How long the WhatsApp/Telegram conversation is kept, in days. 0 keeps it
            indefinitely and is the only value that gives up the guarantee, so the app
            should say so rather than list it plainly. Changing this rewrites the expiry of
            the existing conversation, so lowering it takes effect immediately and
            retroactively. Nothing below 3 days is offered: the coach replays the last 72
            hours, and a shorter retention would have it losing the thread mid-exchange.
        termsAndConditionsAccepted:
          type: boolean
          description: Consent — see aiAccepted for how all three behave. Required to use the app.
        marketingAccepted:
          type: boolean
          description: Consent — see aiAccepted for how all three behave. The one optional consent.
        aiAccepted:
          type: boolean
          description: >
            Consent to the user's voice being processed by Google's AI. Required to use the
            app: sessions are the product and they cannot run without it.

            These three are collected at registration, but not everyone arrives that way.
            "Continue with Apple" (or Google) on the sign-in screen creates an account
            without passing through the signup steps, so such a user holds none of them —
            not even the Terms — and neither do accounts predating a given consent. Those
            users are asked in the app before their first session and the answers land here,
            which is why all three are writable and not just the AI one.

            Write-only and one-way, all three. Only `true` is meaningful: it stamps the
            matching `*AcceptedAt` with the server's clock, and does so once — a second
            `true` leaves the original moment intact, because when consent was first given
            is the auditable fact. `false` is ignored rather than treated as a withdrawal;
            revoking the required ones means deleting the account, not editing a profile
            field. The timestamps are returned on the User schema as
            `termsAndConditionsAcceptedAt`, `marketingAcceptedAt` and `aiAcceptedAt`.

