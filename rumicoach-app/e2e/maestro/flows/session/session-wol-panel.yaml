# P1: Session Wheel of Life Panel
# Tests: WoL panel renders during session wrap-up
# Tags: session

appId: coach.rumi.app.qa
tags:
  - session
---
- runFlow: ../helpers/login-email-otp.yaml

- waitForAnimationToEnd:
    timeout: 10000

# Navigate to session
- tapOn:
    text: "Session"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# Start session
- tapOn:
    id: "start-session-button"
    optional: true

- tapOn:
    text: "Start"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

- runFlow: ../helpers/handle-permissions.yaml

# Wait for connection
- waitForAnimationToEnd:
    timeout: 10000

# Send enough messages to trigger wrap-up
- tapOn:
    id: "text-input"
    optional: true

- inputText: "I want to talk about my career growth"
- tapOn:
    id: "send-button"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- inputText: "I feel stuck in my current role"
- tapOn:
    id: "send-button"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- inputText: "I need to develop leadership skills"
- tapOn:
    id: "send-button"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- inputText: "What should I focus on first?"
- tapOn:
    id: "send-button"
    optional: true

# Wait for wrap-up panels
- waitForAnimationToEnd:
    timeout: 15000

# Verify WoL panel appears
- assertVisible:
    text: ".*"
    optional: true

# End session
- tapOn:
    id: "end-session-button"
    optional: true

- tapOn:
    text: "End Session"
    optional: true

- waitForAnimationToEnd:
    timeout: 10000
