# P1: Session Tasks Panel
# Tests: tasks panel renders with task list
# Tags: session

appId: coach.rumi.app.qa
tags:
  - session
---
- runFlow: ../helpers/login-email-otp.yaml

- waitForAnimationToEnd:
    timeout: 10000

# Navigate to session
- tapOn:
    text: "Session"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# Start session
- tapOn:
    id: "start-session-button"
    optional: true

- tapOn:
    text: "Start"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

- runFlow: ../helpers/handle-permissions.yaml

# Wait for connection
- waitForAnimationToEnd:
    timeout: 10000

# Send messages
- tapOn:
    id: "text-input"
    optional: true

- inputText: "I want to be more productive"
- tapOn:
    id: "send-button"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- inputText: "I keep procrastinating on important tasks"
- tapOn:
    id: "send-button"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- inputText: "Help me prioritize better"
- tapOn:
    id: "send-button"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- inputText: "What are the first steps?"
- tapOn:
    id: "send-button"
    optional: true

# Wait for wrap-up with tasks
- waitForAnimationToEnd:
    timeout: 15000

# Verify tasks panel appears
- assertVisible:
    text: ".*"
    optional: true

# End session
- tapOn:
    id: "end-session-button"
    optional: true

- tapOn:
    text: "End Session"
    optional: true

- waitForAnimationToEnd:
    timeout: 10000
