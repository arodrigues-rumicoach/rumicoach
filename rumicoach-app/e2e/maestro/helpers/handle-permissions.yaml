# Helper: Handle iOS/Android permission dialogs
# Usage: maestro test helpers/handle-permissions.yaml

appId: coach.rumi.app.qa
---
# iOS permission dialogs
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          text: "Allow"
          optional: true

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn:
          text: "OK"
          optional: true

# Android permission dialogs
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn:
          text: "While using the app"
          optional: true

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          text: "Allow"
          optional: true

- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn:
          text: "ALLOW"
          optional: true

# Notification permission
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn:
          text: "Allow"
          optional: true
